name: Prepare pinned sibling dependencies
description: Check out exact revisions, verify clean checkouts, and select one SDK for direct and transitive consumers.
outputs:
  cache-key:
    description: Hash of dependency pins, manifest, lockfile, and toolchain selection.
    value: ${{ steps.pins.outputs.cache-key }}
runs:
  using: composite
  steps:
    - name: Read dependency pins
      id: pins
      shell: bash
      run: python "${{ github.action_path }}/../../scripts/dependencies.py" outputs
    - name: Check out xgpui
      uses: actions/checkout@v5
      with:
        repository: ${{ steps.pins.outputs.xgpui-repository }}
        ref: ${{ steps.pins.outputs.xgpui-revision }}
        path: xgpui
        persist-credentials: false
    - name: Check out GPUI Luma
      uses: actions/checkout@v5
      with:
        repository: ${{ steps.pins.outputs.gpui-luma-repository }}
        ref: ${{ steps.pins.outputs.gpui-luma-revision }}
        path: gpui-luma
        persist-credentials: false
    - name: Verify clean pins and configure SDK patches
      shell: bash
      run: python "${{ github.action_path }}/../../scripts/dependencies.py" prepare
