[package]
name = "xgpui-lab"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# Opt-in app-side Metal/wgpu parity validation for the Grid sample.
grid-wgpu = ["dep:gpui-wgpu", "xgpui-shader/wgpu"]
# Headless exposition and event-log tests; does not launch XGPUI Lab.
test-support = ["gpui-luma/test-support"]
# Identifies the distributable build; embedded benchmarks remain available.
portable-app = []

[dependencies]
gpui-wgpu = { package = "xgpui-wgpu", path = "../xgpui/gpui/crates/gpui-wgpu", features = ["test-support"], optional = true }
libc = "0.2"
bytemuck = { version = "1", features = ["derive"] }
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
xgpui-parley = { path = "../xgpui/extensions/crates/xgpui-parley", features = ["system-fonts"] }
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
skrifa = "=0.44.0"
unicode-segmentation = "1"
xgpui-media = { path = "../xgpui/extensions/crates/xgpui-media" }
xgpui-svg = { path = "../xgpui/extensions/crates/xgpui-svg" }
tempfile = "3"
xgpui-color = { path = "../xgpui/extensions/crates/xgpui-color" }
xgpui-shader = { path = "../xgpui/extensions/crates/xgpui-shader", features = ["portable-shaders"] }
xgpui-gamut = { path = "../xgpui/extensions/crates/xgpui-gamut", features = ["instanced"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
gpui = { package = "xgpui", path = "../xgpui/gpui/crates/gpui", features = ["profiler", "test-support"] }
gpui-luma = { path = "../gpui-luma/crates/sdk" }
gpui-luma-color = { path = "../gpui-luma/crates/luma-color" }
gpui_platform = { package = "xgpui-platform", path = "../xgpui/gpui/crates/gpui-platform", features = ["font-kit", "test-support"] }
image = "0.25"
gpui-luma-look-radix = { path = "../gpui-luma/crates/look-radix" }
lucide-svg-static = { package = "lucide-static-svg", version = "1.45.0" }
palette = "0.7.7"
smallvec = "1"
tiny-skia = "0.11"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package.gpui-luma]
opt-level = 2

[profile.dev.package.xgpui-lab]
opt-level = 1

[profile.dev.package.xgpui]
opt-level = 3

[profile.dev.package.xgpui-platform]
opt-level = 3

[profile.dev.package.smol]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

# Enable cross-crate optimization for shipped applications while preserving panic unwinding.
[profile.release]
lto = "thin"
codegen-units = 1

# Use the sibling xgpui framework/backends; supporting crates come from crates.io.
[patch.crates-io]
"xgpui" = { path = "../xgpui/gpui/crates/gpui" }
"xgpui-apple" = { path = "../xgpui/gpui/crates/gpui-apple" }
"xgpui-linux" = { path = "../xgpui/gpui/crates/gpui-linux" }
"xgpui-macos" = { path = "../xgpui/gpui/crates/gpui-macos" }
"xgpui-macros" = { path = "../xgpui/gpui/crates/gpui-macros" }
"xgpui-platform" = { path = "../xgpui/gpui/crates/gpui-platform" }
"xgpui-web" = { path = "../xgpui/gpui/crates/gpui-web" }
"xgpui-wgpu" = { path = "../xgpui/gpui/crates/gpui-wgpu" }
"xgpui-windows" = { path = "../xgpui/gpui/crates/gpui-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
gpui-apple = { package = "xgpui-apple", path = "../xgpui/gpui/crates/gpui-apple", features = ["test-support"] }
