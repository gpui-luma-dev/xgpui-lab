[package]
name = "xgpui-lab"
default-run = "xgpui-lab"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
# Opt-in app-side Metal/wgpu parity validation for the Grid sample.
grid-wgpu = ["dep:gpui-wgpu", "xgpui-shader/wgpu"]
# Headless exposition and event-log tests; does not launch XGPUI Lab.
test-support = ["gpui-luma/test-support", "gpui-luma-color/test-support"]
# Identifies the distributable build; embedded benchmarks remain available.
portable-app = []

[dependencies]
log = "0.4"
gpui-wgpu = { package = "xgpui-wgpu", version = "=1.0.2", features = ["test-support"], optional = true }
libc = "0.2"
bytemuck = { version = "1", features = ["derive"] }
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
xgpui-parley = { version = "=0.2.2", features = ["system-fonts"] }
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
skrifa = "=0.44.0"
unicode-segmentation = "1"
xgpui-media = { version = "=0.4.0" }
xgpui-svg = { version = "=0.2.2" }
tempfile = "3"
xgpui-color = { version = "=0.3.0", features = ["icc"] }
xgpui-shader = { version = "=0.3.0", features = ["portable-shaders"] }
xgpui-gamut = { version = "=0.2.2", features = ["instanced"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
gpui = { package = "xgpui", version = "=1.2.0", features = ["profiler", "test-support"] }
gpui-luma = { version = "=0.2.5" }
gpui-luma-color = { version = "=0.2.5" }
gpui_platform = { package = "xgpui-platform", version = "=1.0.2", features = ["font-kit", "test-support"] }
image = "0.25"
gpui-luma-look-radix = { version = "=0.2.5" }
lucide-svg-static = { package = "lucide-static-svg", version = "1.45.0" }
palette = "0.7.7"
smallvec = "1"
tiny-skia = "0.11"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package.gpui-luma]
opt-level = 2

[profile.dev.package.xgpui-lab]
opt-level = 1

[profile.dev.package.xgpui]
opt-level = 3

[profile.dev.package.xgpui-platform]
opt-level = 3

[profile.dev.package.smol]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

# Enable cross-crate optimization for shipped applications while preserving panic unwinding.
[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
gpui-apple = { package = "xgpui-apple", version = "=2.0.1", features = ["test-support"] }

[patch.crates-io]
# Prototype field paint hook; shader stays app-owned until the SDK API is upstreamed.
gpui-luma-color = { path = "patches/gpui-luma-color" }
